version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      react-router:
        patterns:
          - '@react-router/*'
          - '@vercel/react-router'
          - 'react-router'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      radix-ui:
        patterns:
          - '@radix-ui/*'
      typescript-eslint:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@types/node'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'globals'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tailwind-merge'
          - 'tw-animate-css'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-plugin-*'
          - '@trivago/prettier-plugin-*'
      testing:
        patterns:
          - '@playwright/test'
          - 'vitest'
      markdown:
        patterns:
          - 'react-markdown'
          - 'remark-*'
          - 'rehype-*'
      icons:
        patterns:
          - '@iconify/json'
          - '@svgr/*'
          - 'unplugin-icons'
          - 'lucide-react'
      math:
        patterns:
          - 'katex'
          - 'remark-math'
          - 'rehype-katex'
    open-pull-requests-limit: 10
