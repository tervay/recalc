[tools]
jq = "1.8.2"
node = "24.17.0"
pnpm = "11.8.0"

[hooks]
enter = "pnpm install --frozen-lockfile"

[tasks."check:types"]
description = "TypeScript type checking"
run = "pnpm typecheck"

[tasks."check:format"]
description = "Verify formatting with oxfmt"
run = "pnpm format"

[tasks."check:lint"]
description = "Lint with oxlint"
run = "pnpm lint"

[tasks.check]
description = "Run typecheck, format check, and lint in parallel"
depends = ["check:types", "check:format", "check:lint"]

[tasks."format:web"]
description = "Format web source with oxfmt"
run = "pnpm format:fix"

[tasks."format:cpp"]
description = "Format C++ source"
run = "pnpm format:wpi"

[tasks.format]
description = "Format web (oxfmt) and C++ source simultaneously"
depends = ["format:web", "format:cpp"]

[tasks.build]
description = "Build the React Router application"
run = "pnpm build"

[tasks."test:e2e"]
description = "Build app then run Playwright E2E tests"
depends = ["build"]
run = "pnpm test:playwright"
