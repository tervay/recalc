- alert:
  - img
  - text: Warning!
  - paragraph: Many smaller gears have a different pitch diameter / center distance than the teeth they actually have. This calculator does not account for this!
  - paragraph:
    - text: For example,
    - link "WCP-1720":
      - /url: https://wcproducts.com/products/wcp-1720
    - text: has 16t but an 18t center distance. For this calculator, you would use it as an 18t gear.
